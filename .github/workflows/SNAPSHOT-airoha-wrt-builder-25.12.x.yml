name: Build Airoha Wrt Builder 25.12.x -TEST

on:
  workflow_dispatch:
    inputs:
      device:
        description: '请选择或输入要编译的软路由设备 PROFILE (例如 gemtek-xr1710g-ubi)'
        required: true
        default: 'gemtek-xr1710g-ubi'
        type: string
      dtb_source:
        description: '【兜底选项】若智能比对失效，默认使用的自定义 DTB 来源'
        required: true
        default: 'naoki66'
        type: choice
        options:
          - 'naoki66'
          - 'SongOfLightAndShadow'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 环境准备与安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libssl-dev \
            zlib1g-dev gawk gettext file wget ccache xz-utils u-boot-tools jq

      - name: 下载并解压 Airoha Image Builder
        run: |
          echo "📥 正在获取并解压 Airoha 平台的 Image Builder..."
          # 这里预留标准的解压与下载逻辑结构（根据具体 25.12.x 的实际源码包链接替换）
          # wget -q https://downloads.immortalwrt.org/releases/25.12.x/targets/airoha/generic/immortalwrt-imagebuilder-xxx.tar.xz
          # tar -xJF *.tar.xz --strip-components=1
          
          # 创建必须的虚拟目录结构以确保后续的检测与注入逻辑能顺畅跑通
          mkdir -p target/linux/airoha/image-schemes
          mkdir -p build_dir/target-aarch64_cortex-a53_musl/linux-airoha

      - name: 智能化设备树检查与 Releases 注入机制
        run: |
          TARGET_PROFILE="${{ github.event.inputs.device }}"
          DTB_SRC="${{ github.event.inputs.dtb_source }}"
          
          echo "=== 开始硬件 PROFILE 检查: $TARGET_PROFILE ==="
          
          # 1. 检测所选设备是否在官方原生支持列表内
          IS_NATIVE=false
          if [ -d "target/linux/airoha/image-schemes" ]; then
            if ls target/linux/airoha/image-schemes/ | grep -q "$TARGET_PROFILE"; then
              IS_NATIVE=true
            fi
          fi
          
          # 2. 如果是非官方原生支持设备，启动 Releases DTB 动态注入
          if [ "$IS_NATIVE" = false ]; then
            echo "⚠️ 提示: 设备 [$TARGET_PROFILE] 不在官方原生支持列表中！"
            
            # 自动获取你当前的仓库名 (格式如: Arthur97172/Airoha-wrt-builder)
            OWNER_REPO="${{ github.repository }}" 
            API_URL="https://api.github.com/repos/${OWNER_REPO}/releases/tags/latest-dtb"
            
            echo "🔍 正在从本仓库的 latest-dtb Release 请求设备树资源列表..."
            RELEASE_DATA=$(curl -sL "$API_URL")
            
            # 裁剪掉末尾的 -ubi 或 _ubi 后缀，提取核心设备名 (例如把 gemtek-xr1710g-ubi 变为 gemtek-xr1710g)
            CORE_NAME=$(echo "$TARGET_PROFILE" | sed 's/-ubi//g' | sed 's/_ubi//g')
            
            echo "🔄 正在分析所有适配 [$CORE_NAME] 的 DTB 文件并进行最新时间戳比对..."
            
            # 通过 jq 筛选属于该设备且以 .dtb 结尾的资产，并按 updated_at 降序排序（最新的排在最前面）
            LATEST_DTB_URL=$(echo "$RELEASE_DATA" | jq -r --arg core "$CORE_NAME" '
              .assets
              | map(select(.name | contains($core) and endswith(".dtb")))
              | sort_by(.updated_at)
              | reverse
              | .[0].browser_download_url
            ' 2>/dev/null)
            
            # 提取对应的最新文件名用于日志回显
            LATEST_DTB_NAME=$(echo "$RELEASE_DATA" | jq -r --arg core "$CORE_NAME" '
              .assets
              | map(select(.name | contains($core) and endswith(".dtb")))
              | sort_by(.updated_at)
              | reverse
              | .[0].name
            ' 2>/dev/null)
            
            # 容错处理：如果因为某种原因通过时间排序没拿到，则使用用户手动选择的 dtb_source 作为兜底
            if [ -z "$LATEST_DTB_URL" ] || [ "$LATEST_DTB_URL" == "null" ] || [ "$LATEST_DTB_NAME" == "null" ]; then
              echo "💡 提示: 未能自动比对出最新时间戳，将使用您的手动兜底源: $DTB_SRC"
              DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r --arg prefix "${DTB_SRC}_" --arg core "$CORE_NAME" '.assets[] | select(.name | startswith($prefix) and contains($core)) | .browser_download_url' | head -n 1)
            else
              echo "🔥 智能比对成功！检测到最新提取的设备树文件为: $LATEST_DTB_NAME"
              DOWNLOAD_URL="$LATEST_DTB_URL"
            fi
            
            # 最终检验链接是否有效
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              echo "❌ 错误: 未能在你仓库的 latest-dtb Release 中找到包含 [$CORE_NAME] 的任何 .dtb 文件！"
              echo "请确保你之前运行了提取脚本，并且将文件成功发布到了本仓库的 Releases 里。"
              exit 1
            fi
            
            echo "📥 开始从 Release 下载目标 DTB: $DOWNLOAD_URL"
            mkdir -p ./custom-dtb
            wget -q --show-progress -O ./custom-dtb/custom.dtb "$DOWNLOAD_URL"
            
            # 3. 将下载好的自定义 dtb 强行重命名并注入到 Image Builder 对应的架构平台目录中
            IB_DTB_DIR=$(find . -type d -path "*/linux-airoha" | head -n 1)
            if [ -z "$IB_DTB_DIR" ] || [ ! -d "$IB_DTB_DIR" ]; then
              IB_DTB_DIR="./build_dir/target-aarch64_cortex-a53_musl/linux-airoha"
              mkdir -p "$IB_DTB_DIR"
            fi
            
            # 强行覆盖 Image Builder 最终打包会读取的设备树二进制名字
            INJECT_NAME="image-${TARGET_PROFILE}.dtb"
            cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/$INJECT_NAME"
            
            echo "✅ 自定义设备树注入成功！"
            echo "👉 已将目标 DTB 强行写入为: $IB_DTB_DIR/$INJECT_NAME"
          else
            echo "✅ 确认设备 [$TARGET_PROFILE] 为官方原生支持，将正常使用 Image Builder 内置代码进行编译。"
          fi

      - name: 执行 Image Builder 固件生成
        run: |
          TARGET_PROFILE="${{ github.event.inputs.device }}"
          echo "=== 开始使用 Image Builder 构建最终固件 ==="
          
          # 执行拼装镜像命令 (根据需要可以自行增减要集成的 PACKAGES)
          make image PROFILE="$TARGET_PROFILE" PACKAGES="luci luci-base luci-theme-argon" || {
            echo "❌ 固件打包失败，请检查编译日志或 PROFILE 命名。"
            exit 1
          }

      - name: 整理并归档固件产物
        run: |
          mkdir -p ./artifact
          # 收集编译输出目录下的所有镜像文件 (通常在 bin/targets/ 目录下)
          find bin/targets/ -type f \( -name "*.itb" -o -name "*.bin" -o -name "*img*" \) -exec cp {} ./artifact/ \;
          echo "📦 准备上传的固件产物列表："
          ls -lh ./artifact/

      - name: 上传固件至 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Airoha-Wrt-Firmware-${{ github.event.inputs.device }}
          path: ./artifact/*
