name: 📦 Build Airoha Wrt Builder 25.12.x - SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: '选择编译的固件类型 (例如 immortalwrt / openwrt)'
        required: true
        default: 'immortalwrt'
        type: string
      luci_version:
        description: '选择 LuCI 版本 (例如 25.12.2)'
        required: true
        default: 'snapshots'
        type: string
      device:
        description: '请选择或输入要编译的软路由设备 PROFILE'
        required: true
        default: 'gemtek-xr1710g-ubi'
        type: string
      ipaddr:
        description: "请设置软路由的管理地址(注意仅对多网口软路由有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.10.1"
      include_docker:
        description: '是否包含 Docker (true/false)'
        required: true
        default: 'false'
        type: string
      dtb_source:
        description: '【兜底选项】若智能比对失效，默认使用的自定义 DTB 来源'
        required: true
        default: 'naoki66'
        type: choice
        options:
          - 'naoki66'
          - 'SongOfLightAndShadow'

# 核心环境变量
env:
  # 判断：如果选了 immortalwrt，且版本不是 25.12.0和25.12.1（包含25.12.2~5），就强制降级为 25.12.1；否则保持用户选择
  FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && inputs.luci_version != '25.12.0' && inputs.luci_version != '25.12.1') && 'snapshots' || inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  DOCKER: ${{ inputs.include_docker }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 环境准备与安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libssl-dev \
            zlib1g-dev gawk gettext file wget ccache xz-utils u-boot-tools jq curl

      - name: ⚙️ Set custom IP config
        run: |
          sed -i "s/版本号/${{ env.FINAL_LUCI_VER }}/g" files/etc/uci-defaults/99-custom.sh
          sed -i "s/__IPADDR__/${{ inputs.ipaddr }}/g" files/etc/uci-defaults/99-custom.sh
          sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" files/etc/uci-defaults/99-custom.sh
          echo "✅ 配置修改完成"

      - name: 📥 下载并解压 Airoha Image Builder
        run: |
          echo "📥 正在获取并解压 Airoha 平台的 Image Builder 到 imagebuilder 目录..."
          # 这里保持你仓库原有的 Image Builder 下载解压逻辑，确保解压目标根目录名字或软链接为 imagebuilder
          URL="https://downloads.${{ env.FINAL_WRT }}.org/${{ env.FINAL_LUCI_VER }}/targets/airoha/an7581/${{ env.FINAL_WRT }}-imagebuilder-airoha-an7581.Linux-x86_64.tar.zst"
          curl -Lf -o imagebuilder.tar.zst "$URL"
          tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
          mv -- ${{ env.FINAL_WRT }}-imagebuilder-* imagebuilder

      - name: 🔄 复制必备文件
        run: |
          cp airoha/build25.sh imagebuilder/ 
          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            cp airoha/openwrt-repositories imagebuilder/repositories
            cat shell/apk-openwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
          else
            cp airoha/immortalwrt-repositories imagebuilder/repositories
            cat shell/apk-immortalwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
          fi          
          chmod +x imagebuilder/apk-custom-packages.sh
          cp shell/prepare-packages.sh imagebuilder/
          mkdir -p imagebuilder/files/etc/uci-defaults imagebuilder/files/etc/apk/repositories.d
          cp files/etc/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
          # 追加自定义源到 APK repositories（FIRMWARE 内 /etc/apk/repositories 会用这个）
          cat files/customfeeds/25.customfeeds.list >> imagebuilder/files/etc/apk/repositories.d/customfeeds.list
          echo "✅ 文件准备完成"

      - name: ⚙️ 动态获取 Kmod 哈希并更新配置
        run: |        
          BASE_URL="https://downloads.${{ env.FINAL_WRT }}.org/${{ env.FINAL_LUCI_VER }}/targets/airoha/an7581/kmods/"
          echo "正在从 $BASE_URL 获取最新的内核哈希..."
          KMOD_DIR=$(curl -sL $BASE_URL | grep -oE "[0-9.-]+-[a-f0-9]{32}" | head -n 1)
          if [ -n "$KMOD_DIR" ]; then
            FULL_KMOD_URL="${BASE_URL}${KMOD_DIR}/packages.adb"
            echo "✅ 成功匹配 kmods 路径: $FULL_KMOD_URL"
            # 替换 repositories 文件中的占位符
            sed -i "s|VERSION_PLACEHOLDER|${BUILD_VER}|g" imagebuilder/repositories
            sed -i "s|KMOD_PLACEHOLDER|${FULL_KMOD_URL}|g" imagebuilder/repositories
          else
            echo "❌ 无法获取 Kmod 哈希"
            exit 1
          fi
          echo "=== repositories 内容 ==="
          cat imagebuilder/repositories

      - name: 🛡️ 智能化设备树检查与 Releases 注入机制
        run: |
          TARGET_PROFILE="${{ github.event.inputs.device }}"
          DTB_SRC="${{ github.event.inputs.dtb_source }}"
          
          echo "=== 开始硬件 PROFILE 检查: $TARGET_PROFILE ==="
          
          # 1. 检测所选设备是否在官方原生支持列表内
          # 运行 make info 来查询 Image Builder 官方原生是否已经认识该设备
          cd imagebuilder
          IS_NATIVE=false
          if make info 2>/dev/null | grep -q "$TARGET_PROFILE"; then
            IS_NATIVE=true
          fi
          cd .. # 回到根目录
          
          # 2. 如果是非官方原生支持设备，启动 Releases DTB 动态注入 + Profile 克隆
          if [ "$IS_NATIVE" = false ]; then
            echo "⚠️ 提示: 设备 [$TARGET_PROFILE] 不在官方原生支持列表中！"
            
            # -------------------------------------------------------------
            # 【全新自适应克隆】动态搜索并克隆 gemtek-w1700k-ubi Profile
            # -------------------------------------------------------------
            REF_PROFILE="gemtek-w1700k-ubi"
            echo "⚙️ 开始在 Image Builder 目录中全盘搜索参考设备 [${REF_PROFILE}] 的配置文件..."
            
            # 在 imagebuilder 目录下查找所有含有参考设备名字的文件（排除了编译临时目录和 bin）
            REF_FILES=$(find imagebuilder -type f \( -name "*${REF_PROFILE}*" \) | grep -v "/build_dir/" | grep -v "/bin/" | grep -v "/staging_dir/" || true)
            
            if [ -n "$REF_FILES" ]; then
              echo "📄 找到以下参考配置文件："
              echo "$REF_FILES"
              
              # 逐个复制并重命名，同时全局替换内容
              echo "$REF_FILES" | while read -r REF_FILE; do
                # 生成新文件名（把原文件名中的 w1700k 换成 xr1710g）
                NEW_FILE=$(echo "$REF_FILE" | sed "s/${REF_PROFILE}/${TARGET_PROFILE}/g")
                
                echo "克隆: $REF_FILE -> $NEW_FILE"
                mkdir -p "$(dirname "$NEW_FILE")"
                cp "$REF_FILE" "$NEW_FILE"
                
                # 全局替换内部文本
                sed -i "s/${REF_PROFILE}/${TARGET_PROFILE}/g" "$NEW_FILE"
                
                # 兼容不带-ubi的核心名替换
                REF_CORE=$(echo "$REF_PROFILE" | sed 's/-ubi//g')
                TARGET_CORE=$(echo "$TARGET_PROFILE" | sed 's/-ubi//g')
                sed -i "s/${REF_CORE}/${TARGET_CORE}/g" "$NEW_FILE"
              done
              echo "✅ Profile 配置文件全自适应克隆成功！"
            else
              echo "⚠️ 警告: 未在 Image Builder 中搜索到 ${REF_PROFILE} 的实体文件，尝试修改目标 target info 数据库..."
              # 如果在 25.12 中 Profile 写在特定的单个总数据文件（如 .targetinfo）里，我们直接做文本复制追加
              if [ -f "imagebuilder/.targetinfo" ]; then
                echo "📝 检测到 .targetinfo 数据库，正在动态注入新设备配置..."
                # 提取 w1700k 的配置段并复制一份重命名为 xr1710g 附加到文件末尾
                # 由于 .targetinfo 格式复杂，这里先做备份
                cp imagebuilder/.targetinfo imagebuilder/.targetinfo.bak
                # 简单的流式追加替换（可兼容大部分 Makefile/targetinfo 生成逻辑）
                sed -n "/Target-Profile: ${REF_PROFILE}/,/@@/p" imagebuilder/.targetinfo | \
                  sed "s/${REF_PROFILE}/${TARGET_PROFILE}/g" | \
                  sed "s/$(echo $REF_PROFILE | sed 's/-ubi//g')/$(echo $TARGET_PROFILE | sed 's/-ubi//g')/g" >> imagebuilder/.targetinfo
                echo "✅ .targetinfo 写入成功！"
              fi
            fi
            
            # -------------------------------------------------------------
            # 【DTB 注入】下载并注入你自定义的 DTB 固件
            # -------------------------------------------------------------
            OWNER_REPO="${{ github.repository }}" 
            API_URL="https://api.github.com/repos/${OWNER_REPO}/releases/tags/latest-dtb"
            
            echo "🔍 正在从本仓库的 latest-dtb Release 请求设备树资源列表..."
            RELEASE_DATA=$(curl -sL "$API_URL")
            
            CORE_NAME=$(echo "$TARGET_PROFILE" | sed 's/-ubi//g' | sed 's/_ubi//g')
            
            echo "🔄 正在分析所有适配 [$CORE_NAME] 的 DTB 文件并进行最新时间戳比对..."
            
            LATEST_DTB_URL=$(echo "$RELEASE_DATA" | jq -r --arg core "$CORE_NAME" '
              .assets | map(select(.name | contains($core) and endswith(".dtb"))) | sort_by(.updated_at) | reverse | .[0].browser_download_url
            ' 2>/dev/null)
            
            LATEST_DTB_NAME=$(echo "$RELEASE_DATA" | jq -r --arg core "$CORE_NAME" '
              .assets | map(select(.name | contains($core) and endswith(".dtb"))) | sort_by(.updated_at) | reverse | .[0].name
            ' 2>/dev/null)
            
            if [ -z "$LATEST_DTB_URL" ] || [ "$LATEST_DTB_URL" == "null" ] || [ "$LATEST_DTB_NAME" == "null" ]; then
              echo "💡 提示: 未能自动比对出最新时间戳，将使用您的手动兜底源: $DTB_SRC"
              DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r --arg prefix "${DTB_SRC}_" --arg core "$CORE_NAME" '.assets[] | select(.name | startswith($prefix) and contains($core)) | .browser_download_url' | head -n 1)
            else
              echo "🔥 智能比对成功！检测到最新提取的设备树文件为: $LATEST_DTB_NAME"
              DOWNLOAD_URL="$LATEST_DTB_URL"
            fi
            
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              echo "❌ 错误: 未能在你仓库的 latest-dtb Release 中找到包含 [$CORE_NAME] 的任何 .dtb 文件！"
              exit 1
            fi
            
            echo "📥 开始从 Release 下载目标 DTB: $DOWNLOAD_URL"
            mkdir -p ./custom-dtb
            wget -q --show-progress -O ./custom-dtb/custom.dtb "$DOWNLOAD_URL"
            
            IB_DTB_DIR=$(find imagebuilder -type d -path "*/linux-airoha" | head -n 1)
            if [ -z "$IB_DTB_DIR" ] || [ ! -d "$IB_DTB_DIR" ]; then
              IB_DTB_DIR="imagebuilder/build_dir/target-aarch64_cortex-a53_musl/linux-airoha"
              mkdir -p "$IB_DTB_DIR"
            fi
            
            # 将设备树强行写入最终打包会读取的文件名位置
            INJECT_NAME="image-${TARGET_PROFILE}.dtb"
            cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/$INJECT_NAME"
            
            # 兜底多拷贝一份不带 -ubi 后缀的名字，防止 Makefile 内部生成逻辑剥离了后缀
            INJECT_CORE_NAME="image-${CORE_NAME}.dtb"
            cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/$INJECT_CORE_NAME"
            
            echo "✅ 自定义设备树注入成功！"
            echo "👉 已将目标 DTB 强行写入为: $IB_DTB_DIR/$INJECT_NAME"
          else
            echo "✅ 确认设备 [$TARGET_PROFILE] 为官方原生支持，将正常使用 Image Builder 内置代码进行编译。"
          fi
          
      - name: 🚀 执行 Image Builder 固件生成
        run: |
          TARGET_PROFILE="${{ github.event.inputs.device }}"
          echo "=== 开始使用构建脚本生成最终固件 ==="
          
          cd imagebuilder
          chmod +x build25.sh
          
          # 此时输入用户选定的 "gemtek-xr1710g-ubi" 就可以直接被系统识别了！
          ./build25.sh "$TARGET_PROFILE" || {
            echo "❌ 固件打包失败，请检查编译日志或 PROFILE 命名。"
            exit 1
          }

      - name: 🚀 执行 Image Builder 固件生成
        run: |
          TARGET_PROFILE="${{ github.event.inputs.device }}"
          echo "=== 开始使用构建脚本生成最终固件 ==="
          
          # 切换到 imagebuilder 目录下
          cd imagebuilder
          
          # 给予脚本执行权限（以防万一）
          chmod +x build25.sh
          
          # 执行你仓库专属的构建脚本，传入选定的设备 PROFILE
          ./build25.sh "$TARGET_PROFILE" || {
            echo "❌ 固件打包失败，请检查编译日志或 PROFILE 命名。"
            exit 1
          }

      - name: 📦 整理并归档固件产物
        run: |
          mkdir -p ./artifact
          # 从 imagebuilder/bin/targets/ 目录下收集编译输出的所有镜像文件
          find imagebuilder/bin/targets/ -type f \( -name "*.itb" -o -name "*.bin" -o -name "*img*" \) -exec cp {} ./artifact/ \;
          echo "📦 准备上传的固件产物列表："
          ls -lh ./artifact/

      - name: 📤 上传固件至 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Airoha-Wrt-Firmware-${{ github.event.inputs.device }}
          path: ./artifact/*
