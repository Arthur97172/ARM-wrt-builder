name: 📦 Auto Extract and Release DTB & Profile

on:
  workflow_dispatch: # 在 GitHub 页面手动触发时显示选项
    inputs:
      source_repo:
        description: '请选择要提取 DTB 的源固件仓库'
        required: true
        default: 'naoki66'
        type: choice
        options:
          - 'naoki66 (naoki66/ImmortalWrt-for-Gemtek-XR1710G)'
          - 'SongOfLightAndShadow (SongOfLightAndShadow/immortalwrt-xr1710g-las)'

permissions:
  contents: write

jobs:
  extract-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装 U-Boot 工具与设备树编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y u-boot-tools device-tree-compiler wget jq

      - name: 自动获取并下载选定仓库的最新版本 sysupgrade.itb 固件
        run: |
          SELECTED="${{ github.event.inputs.source_repo }}"
          
          if [[ "$SELECTED" == *"naoki66"* ]]; then
            REPO="naoki66/ImmortalWrt-for-Gemtek-XR1710G"
            SHORT_NAME="naoki66"
            
            echo "🔍 正在获取 $REPO 的最新发布版本..."
            API_URL="https://api.github.com/repos/$REPO/releases/latest"
            DOWNLOAD_URL=$(curl -sL $API_URL | jq -r '.assets[] | select(.name | contains("squashfs-sysupgrade.itb")) | .browser_download_url' | head -n 1)
            
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              DOWNLOAD_URL="https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G/releases/latest/download/immortalwrt-airoha-an7581-gemtek-xr1710g-squashfs-sysupgrade.itb"
            fi
          else
            REPO="SongOfLightAndShadow/immortalwrt-xr1710g-las"
            SHORT_NAME="SongOfLightAndShadow"
            
            echo "🔍 正在分析 $REPO 所有的 Releases 以锁定最新含版本号的固件..."
            RELEASES_API="https://api.github.com/repos/$REPO/releases?per_page=5"
            DOWNLOAD_URL=$(curl -sL "$RELEASES_API" | jq -r '.[].assets[] | select(.name | contains("squashfs-sysupgrade.itb")) | .browser_download_url' | head -n 1)
            
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              LATEST_TAG=$(curl -sL "https://api.github.com/repos/$REPO/releases" | jq -r '.[0].tag_name')
              if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "null" ]; then
                DOWNLOAD_URL="https://github.com/$REPO/releases/download/${LATEST_TAG}/immortalwrt-airoha-an7581-gemtek_xr1710g-ubi-squashfs-sysupgrade.itb"
              else
                DOWNLOAD_URL="https://github.com/SongOfLightAndShadow/immortalwrt-xr1710g-las/releases/download/v1.0.3/immortalwrt-airoha-an7581-gemtek_xr1710g-ubi-squashfs-sysupgrade.itb"
              fi
            fi
          fi
          
          echo "📥 最终确定的最新固件下载链接: $DOWNLOAD_URL"
          wget -q --show-progress -O firmware-sysupgrade.itb "$DOWNLOAD_URL"
          
          # 写入环境变量供后续步骤使用
          echo "SOURCE_NAME=$SHORT_NAME" >> $GITHUB_ENV

      - name: 给脚本添加执行权限
        run: chmod +x extract-dtb.sh

      - name: 执行设备树与 Profile 提取
        run: ./extract-dtb.sh "${{ env.SOURCE_NAME }}"

      - name: 发布 DTB, DTS 与 Profile 配置到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dtb
          name: "Gemtek XR1710G 提取版 DTB 与 Profile 汇总"
          body: |
            这是自动提取/生成的原始设备树文件（.dtb / .dts）以及编译 Profile 配置文件（.mk）。

            - **文件说明**:
              - `*_gemtek_xr1710g.dtb`: 提取自对应仓库固件的设备树二进制文件。
              - `*_gemtek_xr1710g.dts`: 提取自对应仓库固件的设备树源码文件。
              - `*_an7581.mk`: 生成/提取的 Profile 配置文件（内含 `Device/gemtek_xr1710g-ubi` 定义）。
            - **提取时间**: 2026-07-28
            - **使用方法**: 将 `.dts` 放入 ImageBuilder 的 dts 目录，并将 `.mk` 中的相应 Profile 代码复制到你本地 ImageBuilder 的 `an7581.mk` 中即可。
          draft: false
          prerelease: false
          files: |
            output/*.dtb
            output/*.dts
            output/*.mk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
