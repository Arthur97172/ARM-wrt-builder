name: 📦 Build Airoha Wrt Builder 25.12.x - SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: '选择编译的固件类型 (例如 immortalwrt / openwrt)'
        required: true
        default: 'immortalwrt'
        type: string
      luci_version:
        description: '选择 LuCI 版本 (例如 25.12.2)'
        required: true
        default: 'snapshots'
        type: string
      device:
        description: '请选择或输入要编译的软路由设备 PROFILE'
        required: true
        default: 'gemtek_xr1710g-ubi'
        type: string
      ipaddr:
        description: "请设置软路由的管理地址(注意仅对多网口软路由有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.10.1"
      include_docker:
        description: '是否包含 Docker (true/false)'
        required: true
        default: 'false'
        type: string
      dtb_source:
        description: '【兜底选项】若智能比对失效，默认使用的自定义 DTB 来源'
        required: true
        default: 'naoki66'
        type: choice
        options:
          - 'naoki66'
          - 'SongOfLightAndShadow'

# 核心环境变量
env:
  # 判断：如果选了 immortalwrt，且版本不是 25.12.0和25.12.1（包含25.12.2~5），就强制降级为 25.12.1；否则保持用户选择
  FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && inputs.luci_version != '25.12.0' && inputs.luci_version != '25.12.1') && 'snapshots' || inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  DOCKER: ${{ inputs.include_docker }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 环境准备与安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libssl-dev \
            zlib1g-dev gawk gettext file wget ccache xz-utils u-boot-tools jq curl

      - name: ⚙️ Set custom IP config
        run: |
          sed -i "s/版本号/${{ env.FINAL_LUCI_VER }}/g" files/etc/uci-defaults/99-custom.sh
          sed -i "s/__IPADDR__/${{ inputs.ipaddr }}/g" files/etc/uci-defaults/99-custom.sh
          sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" files/etc/uci-defaults/99-custom.sh
          echo "✅ 配置修改完成"

      - name: 📥 下载并解压 Airoha Image Builder
        run: |
          echo "📥 正在获取并解压 Airoha 平台的 Image Builder 到 imagebuilder 目录..."
          URL="https://downloads.${{ env.FINAL_WRT }}.org/${{ env.FINAL_LUCI_VER }}/targets/airoha/an7581/${{ env.FINAL_WRT }}-imagebuilder-airoha-an7581.Linux-x86_64.tar.zst"
          curl -Lf -o imagebuilder.tar.zst "$URL"
          tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
          mv -- ${{ env.FINAL_WRT }}-imagebuilder-* imagebuilder

      - name: 🔄 复制必备文件
        run: |
          cp airoha/build25.sh imagebuilder/ 
          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            cp airoha/openwrt-repositories imagebuilder/repositories
            cat shell/apk-openwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
          else
            cp airoha/immortalwrt-repositories imagebuilder/repositories
            cat shell/apk-immortalwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
          fi          
          chmod +x imagebuilder/apk-custom-packages.sh
          cp shell/prepare-packages.sh imagebuilder/
          mkdir -p imagebuilder/files/etc/uci-defaults imagebuilder/files/etc/apk/repositories.d
          cp files/etc/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
          # 追加自定义源到 APK repositories（FIRMWARE 内 /etc/apk/repositories 会用这个）
          cat files/customfeeds/25.customfeeds.list >> imagebuilder/files/etc/apk/repositories.d/customfeeds.list
          echo "✅ 文件准备完成"

      - name: ⚙️ 动态获取 Kmod 哈希并更新配置
        run: |        
          BASE_URL="https://downloads.${{ env.FINAL_WRT }}.org/${{ env.FINAL_LUCI_VER }}/targets/airoha/an7581/kmods/"
          echo "正在从 $BASE_URL 获取最新的内核哈希..."
          KMOD_DIR=$(curl -sL $BASE_URL | grep -oE "[0-9.-]+-[a-f0-9]{32}" | head -n 1)
          if [ -n "$KMOD_DIR" ]; then
            FULL_KMOD_URL="${BASE_URL}${KMOD_DIR}/packages.adb"
            echo "✅ 成功匹配 kmods 路径: $FULL_KMOD_URL"
            # 替换 repositories 文件中的占位符
            sed -i "s|VERSION_PLACEHOLDER|${{ env.FINAL_LUCI_VER }}|g" imagebuilder/repositories
            sed -i "s|KMOD_PLACEHOLDER|${FULL_KMOD_URL}|g" imagebuilder/repositories
          else
            echo "❌ 无法获取 Kmod 哈希"
            exit 1
          fi
          echo "=== repositories 内容 ==="
          cat imagebuilder/repositories

      - name: 🧬 克隆并注入官方原生 Profile 硬件设备信息
        run: |
          echo "=== 开始向 Image Builder 注入设备 Profile ==="
          # 动态匹配 airoha 平台的 Makefile 路径（多路径兼容）
          MAKEFILE_PATH=$(find imagebuilder -type f -path "*/airoha/image/Makefile" | head -n 1)
          if [ -z "$MAKEFILE_PATH" ] || [ ! -f "$MAKEFILE_PATH" ]; then
            MAKEFILE_PATH=$(find imagebuilder -type f -name "Makefile" | grep -E "image|target" | head -n 1)
          fi
          
          if [ -n "$MAKEFILE_PATH" ] && [ -f "$MAKEFILE_PATH" ]; then
            echo "🎯 找到目标 Makefile: $MAKEFILE_PATH"
            
            # 1. 提取并克隆定义：从 'define Device/gemtek_w1700k-ubi' 一直到 'endef'，将其中的 w1700k 替换为 xr1710g 并追加回 Makefile
            sed -n '/define Device\/gemtek_w1700k-ubi/,/endef/p' "$MAKEFILE_PATH" | \
              sed 's/gemtek_w1700k-ubi/gemtek_xr1710g-ubi/g' | \
              sed 's/gemtek-w1700k-ubi/gemtek-xr1710g-ubi/g' | \
              sed 's/Gemtek W1700K/Gemtek XR1710G/g' | \
              sed 's/w1700k/xr1710g/g' >> "$MAKEFILE_PATH"
            
            # 2. 将新克隆出的设备追加到 Target Devices 编译列表中
            sed -i '/TARGET_DEVICES +=/ s/$/ gemtek_xr1710g-ubi/' "$MAKEFILE_PATH"
            
            echo "🔥 成功将克隆出的 [gemtek_xr1710g-ubi] 注入到 Makefile 编译树中！"
          else
            echo "❌ 错误：无法定位 Makefile，Profile 注入失败！"
            exit 1
          fi

      - name: 🛡️ 智能化设备树检查与 Releases 注入机制
        id: custom_dtb_prepare
        run: |
          TARGET_PROFILE="${{ github.event.inputs.device }}"
          DTB_SRC="${{ github.event.inputs.dtb_source }}"
          
          echo "=== 开始硬件 PROFILE 检查: $TARGET_PROFILE ==="
          
          # -------------------------------------------------------------
          # 【自适应 Profile 嗅探系统】通过 make info 寻找真实可用的官方 Profile
          # -------------------------------------------------------------
          cd imagebuilder
          echo "🔍 正在读取 Image Builder 支持的可用 Profile 列表..."
          # 优化正则：容忍前置空格，同时清理首尾空白
          ALL_PROFILES=$(make info 2>/dev/null | grep -E '^[[:space:]]*[a-zA-Z0-9_-]+[[:space:]]*$' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)
          echo "📋 官方支持的所有 Profile 列表如下："
          echo "$ALL_PROFILES"
          
          IS_NATIVE=false
          FINAL_BUILD_PROFILE=""
          IS_CLONED=false
          
          # 1. 检查当前输入的 PROFILE 是否原生/注入存在
          if echo "$ALL_PROFILES" | grep -xq "$TARGET_PROFILE"; then
            IS_NATIVE=true
            FINAL_BUILD_PROFILE="$TARGET_PROFILE"
            echo "🎉 完美！系统成功识别并直接支持该 Profile: $TARGET_PROFILE"
          fi
          
          # 2. 如果依然不原生支持（防万一的兜底），寻找替代的官方 Profile（借鸡生蛋）
          if [ "$IS_NATIVE" = false ]; then
            echo "⚠️ 设备 [$TARGET_PROFILE] 在列表中未被激活，采用借鸡生蛋方案。"
            
            # 2.1 尝试寻找官方不带 -ubi 后缀的版本
            TARGET_CORE=$(echo "$TARGET_PROFILE" | sed 's/-ubi//g')
            MATCHED_PROFILE=$(echo "$ALL_PROFILES" | grep -x "${TARGET_CORE}" | head -n 1 || true)
            
            # 2.2 优先匹配正确的带下划线或连字符的原生模版
            if [ -z "$MATCHED_PROFILE" ]; then
              MATCHED_PROFILE=$(echo "$ALL_PROFILES" | grep -E "gemtek[_-]xr1710g" | head -n 1 || true)
            fi
            
            # 2.3 优先匹配官方的原生模板：gemtek_w1700k-ubi
            if [ -z "$MATCHED_PROFILE" ]; then
              MATCHED_PROFILE=$(echo "$ALL_PROFILES" | grep -E "gemtek[_-]w1700k" | head -n 1 || true)
            fi
            
            # 2.4 兜底：匹配任意包含 gemtek 的官方 Profile 
            if [ -z "$MATCHED_PROFILE" ]; then
              MATCHED_PROFILE=$(echo "$ALL_PROFILES" | grep "gemtek" | head -n 1 || true)
            fi
            
            # 2.5 如果连 gemtek 都没找到，使用默认的 generic 兜底
            if [ -z "$MATCHED_PROFILE" ]; then
              MATCHED_PROFILE=$(echo "$ALL_PROFILES" | grep -E "generic|default" | head -n 1 || echo "$ALL_PROFILES" | head -n 1)
            fi
            
            echo "💡 智能化匹配：我们将借用官方原生存在的 [$MATCHED_PROFILE] 作为编译模板！"
            FINAL_BUILD_PROFILE="$MATCHED_PROFILE"
            IS_CLONED=true
          fi
          cd .. # 返回工作流根目录
          
          # -------------------------------------------------------------
          # 【DTB 下载】兼容下划线 `_` 和 连字符 `-`
          # -------------------------------------------------------------
          OWNER_REPO="${{ github.repository }}" 
          API_URL="https://api.github.com/repos/${OWNER_REPO}/releases/tags/latest-dtb"
          
          echo "🔍 正在从本仓库的 latest-dtb Release 请求设备树资源列表..."
          RELEASE_DATA=$(curl -sL "$API_URL")
          
          # 确保获取到合法的 JSON 响应
          if ! echo "$RELEASE_DATA" | jq empty 2>/dev/null; then
            echo "⚠️ 获取 Release 数据异常，转为手动兜底源下载。"
            RELEASE_DATA='{"assets": []}'
          fi
          
          # 提取核心名（清理 -ubi 等尾缀）
          CORE_NAME=$(echo "$TARGET_PROFILE" | sed 's/-ubi//g' | sed 's/_ubi//g')
          # 建立互锁兼容名：如果 CORE_NAME 含有下划线，也生成连字符版本
          CORE_ALT=$(echo "$CORE_NAME" | tr '_' '-')
          
          echo "🔄 正在分析所有适配 [$CORE_NAME] 或 [$CORE_ALT] 的 DTB 文件并进行最新时间戳比对..."
          
          # 增加 jq 的安全判空防护机制
          LATEST_DTB_URL=$(echo "$RELEASE_DATA" | jq -r --arg core1 "$CORE_NAME" --arg core2 "$CORE_ALT" '
            if .assets then
              .assets | map(select((.name | contains($core1) or contains($core2)) and endswith(".dtb"))) | sort_by(.updated_at) | reverse | .[0].browser_download_url
            else
              null
            end
          ' 2>/dev/null || echo "null")
          
          LATEST_DTB_NAME=$(echo "$RELEASE_DATA" | jq -r --arg core1 "$CORE_NAME" --arg core2 "$CORE_ALT" '
            if .assets then
              .assets | map(select((.name | contains($core1) or contains($core2)) and endswith(".dtb"))) | sort_by(.updated_at) | reverse | .[0].name
            else
              null
            end
          ' 2>/dev/null || echo "null")
          
          if [ -z "$LATEST_DTB_URL" ] || [ "$LATEST_DTB_URL" = "null" ] || [ "$LATEST_DTB_NAME" = "null" ]; then
            echo "💡 提示: 未能自动比对出最新时间戳，将使用您的手动兜底源: $DTB_SRC"
            DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r --arg prefix "${DTB_SRC}_" --arg core1 "$CORE_NAME" --arg core2 "$CORE_ALT" '
              if .assets then
                .assets[] | select(.name | startswith($prefix) and (contains($core1) or contains($core2))) | .browser_download_url
              else
                null
              end
            ' 2>/dev/null | head -n 1)
          else
            echo "🔥 智能比对成功！检测到最新提取的设备树文件为: $LATEST_DTB_NAME"
            DOWNLOAD_URL="$LATEST_DTB_URL"
          fi
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "❌ 错误: 未能在你仓库的 latest-dtb Release 中找到适配 [$CORE_NAME] 或 [$CORE_ALT] 的任何 .dtb 文件！"
            exit 1
          fi
          
          echo "📥 开始从 Release 下载目标 DTB: $DOWNLOAD_URL"
          mkdir -p ./custom-dtb
          wget -q --show-progress -O ./custom-dtb/custom.dtb "$DOWNLOAD_URL"
          
          # -------------------------------------------------------------
          # 【强行覆盖 DTB】
          # -------------------------------------------------------------
          IB_DTB_DIR=$(find imagebuilder -type d -path "*/linux-airoha" | head -n 1)
          if [ -z "$IB_DTB_DIR" ] || [ ! -d "$IB_DTB_DIR" ]; then
            IB_DTB_DIR="imagebuilder/build_dir/target-aarch64_cortex-a53_musl/linux-airoha"
            mkdir -p "$IB_DTB_DIR"
          fi
          
          # 1. 拷贝目标设备名字的 DTB
          cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/image-${TARGET_PROFILE}.dtb"
          cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/image-${CORE_NAME}.dtb"
          cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/image-${CORE_ALT}.dtb"
          
          # 2. 如果是借用编译，将借用模板对应的所有可能 DTB 名字全部掉包！
          if [ "$IS_CLONED" = true ]; then
            REF_CORE=$(echo "$FINAL_BUILD_PROFILE" | sed 's/-ubi//g')
            REF_ALT=$(echo "$REF_CORE" | tr '_' '-')
            echo "🔥 正在将自定义设备树强行覆盖借用模板的设备树 ($FINAL_BUILD_PROFILE) ..."
            cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/image-${FINAL_BUILD_PROFILE}.dtb"
            cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/image-${REF_CORE}.dtb"
            cp ./custom-dtb/custom.dtb "$IB_DTB_DIR/image-${REF_ALT}.dtb"
          fi
          
          echo "✅ 自定义设备树注入与掉包成功！"
          
          # 传递输出参数给后续步骤
          echo "build_profile=${FINAL_BUILD_PROFILE}" >> $GITHUB_OUTPUT
          echo "is_cloned=${IS_CLONED}" >> $GITHUB_OUTPUT
          echo "cloned_from=${FINAL_BUILD_PROFILE}" >> $GITHUB_OUTPUT

      - name: 🚀 执行 Image Builder 固件生成
        run: |
          # 获取动态匹配到的可用 Profile
          FINAL_PROFILE="${{ steps.custom_dtb_prepare.outputs.build_profile }}"
          echo "=== 开始使用构建脚本生成最终固件，实际使用的 Profile 为: $FINAL_PROFILE ==="
          
          cd imagebuilder
          chmod +x build25.sh
          
          ./build25.sh "$FINAL_PROFILE" || {
            echo "❌ 固件打包失败，请检查编译日志。"
            exit 1
          }

      - name: 📦 整理并归档固件产物
        run: |
          mkdir -p ./artifact
          
          # 切换到固件输出目录
          OUT_DIR="imagebuilder/bin/targets/airoha/an7581"
          if [ -d "$OUT_DIR" ]; then
            cd "$OUT_DIR"
            
            # 如果进行了借鸡生蛋编译，我们需要把产出固件名中的“借用模板名”恢复成用户想要的“目标设备名”
            if [ "${{ steps.custom_dtb_prepare.outputs.is_cloned }}" = "true" ]; then
              REF_NAME="${{ steps.custom_dtb_prepare.outputs.cloned_from }}"
              REF_CORE=$(echo "$REF_NAME" | sed 's/-ubi//g')
              REF_ALT=$(echo "$REF_CORE" | tr '_' '-')
              TARGET_NAME="${{ github.event.inputs.device }}"
              
              echo "🔄 检测到借用编译，正在重命名输出固件..."
              
              # 双向替换（兼容下划线和连字符格式）
              for file in *; do
                if [ -f "$file" ]; then
                  new_file="$file"
                  if [[ "$file" == *"$REF_CORE"* ]]; then
                    new_file=$(echo "$file" | sed "s/${REF_CORE}/${TARGET_NAME}/g")
                  elif [[ "$file" == *"$REF_ALT"* ]]; then
                    new_file=$(echo "$file" | sed "s/${REF_ALT}/${TARGET_NAME}/g")
                  fi
                  # 清除双后缀
                  new_file=$(echo "$new_file" | sed "s/-ubi-ubi/-ubi/g" | sed "s/_ubi_ubi/_ubi/g")
                  if [ "$file" != "$new_file" ]; then
                    echo "重命名: $file -> $new_file"
                    mv "$file" "$new_file"
                  fi
                fi
              done
            fi
            cd - # 返回工作流根目录
          fi
          
          # 收集编译输出的所有镜像文件
          find imagebuilder/bin/targets/ -type f \( -name "*.itb" -o -name "*.bin" -o -name "*img*" \) -exec cp {} ./artifact/ \;
          echo "📦 准备上传的固件产物列表："
          ls -lh ./artifact/

      - name: 📤 上传固件至 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Airoha-Wrt-Firmware-${{ github.event.inputs.device }}
          path: ./artifact/*
