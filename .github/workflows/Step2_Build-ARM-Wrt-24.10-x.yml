env:
  # 判断：如果是 immortalwrt，且版本等于 24.10.7或者24.10.8，则强制降级为 24.10.6；否则保持用户选择
  FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && (inputs.luci_version == '24.10.7' || inputs.luci_version == '24.10.8')) && '24.10.6' || inputs.luci_version }}
  #FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && inputs.luci_version == '24.10.7') && '24.10.6' || inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  WRT_NAME: ${{ (inputs.wrt_version == 'openwrt') && 'OpenWrt' || 'ImmortalWrt' }}
  DOCKER: ${{ inputs.include_docker }}
  
jobs:
  build:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ⏬ 下载 ${{ env.FINAL_WRT }}-rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          
          # 1. 下载 rootfs 包
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/${{ github.actor }}/ARM-wrt-builder/releases/download/${{ env.FINAL_WRT }}-ARM-${{ env.FINAL_LUCI_VER }}-${{ inputs.openwrt_rootfs }}-${{ inputs.network_settings }}/${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-armsr-armv8-generic-rootfs-Docker-${{ env.DOCKER }}.tar.gz

      - name: 🔍 查找${{ env.FINAL_WRT }}-rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: 🧱 打包 Wrt 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee
 
      - name: 📅 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 📜 调整.img.gz 文件名
        id: rename
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            echo "Processing file: $FILE"
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/${{ env.FINAL_WRT }}_${{ env.FINAL_LUCI_VER }}-Docker-${{ env.DOCKER }}/g')
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed $FILENAME to $NEW_FILENAME"
            else
              echo "No need to rename $FILENAME"
            fi
          done

      - name: 📖 读取后台描述文件
        id: read_info
        run: |
          if [ -f "info.txt" ]; then
            echo "✅ 成功找到 info.txt，开始读取..."
            # 使用多行变量语法写入 GITHUB_ENV
            echo "ROUTER_INFO<<EOF" >> $GITHUB_ENV
            cat info.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "⚠️ 未找到 info.txt，将使用默认描述信息"
            echo "ROUTER_INFO=📌 版本：${{ env.FINAL_WRT }}-ARM-${{ env.FINAL_LUCI_VER }}" >> $GITHUB_ENV
          fi

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.FINAL_WRT }}-ARM-${{ env.FINAL_LUCI_VER }}-${{ inputs.openwrt_rootfs }}-${{ inputs.network_settings }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
