name: 💿 Step1_Build-Rootfs-ARM-Wrt-25.12.x

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: "选择OpenWrt/Immortalwrt"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - 'immortalwrt'
          - 'openwrt'
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.5"
        type: choice
        options:
          - '25.12.0'
          - '25.12.1'
          - '25.12.2'
          - '25.12.3'
          - '25.12.4'
          - '25.12.5'             
      network_settings:
        description: "请选择初始网络配置"
        required: true
        default: 'static'
        type: choice
        options:
          - 'static'
          - 'dhcp'
      ipaddr:
        description: "请设置软路由的管理地址,格式:192.168.x.1"
        required: true
        default: '192.168.10.1'
      gateway:
        description: '请输入默认网关'
        required: true
        default: '192.168.10.1'
      rootfs_partsize:
        description: '设置软件包大小 单位(MB)'
        required: true
        default: '2048'
        type: choice
        options:
          - '256'
          - '512'
          - '1024'
          - '2048'
          - '3072'
          - '4096' 
      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - 'yes'
          - 'no'    

env:
  # 判断：如果选了 immortalwrt，且版本不是 25.12.0和25.12.1（包含25.12.2~5），就强制降级为 25.12.1；否则保持用户选择
  FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && inputs.luci_version != '25.12.0' && inputs.luci_version != '25.12.1') && '25.12.1' || inputs.luci_version }}
  #FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && inputs.luci_version == '24.10.7') && '24.10.6' || inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  WRT_NAME: ${{ (inputs.wrt_version == 'openwrt') && 'OpenWrt' || 'ImmortalWrt' }}
  ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
  DOCKER: ${{ inputs.include_docker }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # 关键：添加写入权限，解决 403 报错
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 🛠️ 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zstd curl unzip tree qemu-utils genisoimage

    - name: ⚙️ 设置可执行权限
      run: | 
        chmod +x arm64/build25.sh
        chmod +x arm64/immortalwrt-repositories
        chmod +x arm64/openwrt-repositories
        chmod +x shell/*.sh

    - name: ⚙️ 设置IP、网关和版本号
      run: |
        CONFIG_PATH="./files/etc/uci-defaults/99-custom.sh"
        echo "当前网络配置路径: $CONFIG_PATH"
        
        # 1. 替换版本号占位符
        sed -i "s/版本号/${{ env.FINAL_LUCI_VER }}/g" "$CONFIG_PATH"
        [ -f "./files/etc/banner" ] && sed -i "s/版本号/${{ env.FINAL_LUCI_VER }}/g" "./files/etc/banner"

        # 2. 网络逻辑配置 (关键修改点：不再删除行，改用关键词替换)
        if [ "${{ inputs.network_settings }}" = "static" ]; then
           echo "模式：静态IP (旁路由)"
           # 将脚本内默认的 192.168.10.1 替换为用户输入的 IP
           sed -i "s/192.168.10.1/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
           
           # 在设置 IP 的代码行后，动态插入网关和 DNS 设置
           sed -i "/uci set network.lan.ipaddr/a \        uci set network.lan.gateway='${{ inputs.gateway }}'\n        uci set network.lan.dns='${{ inputs.gateway }}'" "$CONFIG_PATH"
        else
           echo "模式：DHCP / 默认模式 (主路由)"
           # 保持原脚本逻辑：单网口自动 DHCP，多网口保持 192.168.10.1
        fi

        # 3. 替换脚本末尾的描述信息
        sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$CONFIG_PATH"
        
        echo "✅ 配置修改完成，输出预览："
        cat "$CONFIG_PATH"

    - name: ⏬ 下载 ImageBuilder-${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}文件
     # 必须在这里添加这个 env 块
      run: |
        URL="https://downloads.${{ env.FINAL_WRT }}.org/releases/${{ env.FINAL_LUCI_VER }}/targets/armsr/armv8/${{ env.FINAL_WRT }}-imagebuilder-${{ env.FINAL_LUCI_VER }}-armsr-armv8.Linux-x86_64.tar.zst"
        curl -Lf -o imagebuilder.tar.zst "$URL"

        echo "正在下载: $URL"
        # 使用 -f 确保如果文件不存在时报错停止，而不是下载一个错误页面
        curl -Lf -o imagebuilder.tar.zst "$URL"
        
        # 解压
        tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
        # 这里的解压目录匹配官方默认生成的文件夹名
        mv ${{ env.FINAL_WRT }}-imagebuilder-* imagebuilder

    - name: 🔄 复制并设置必备文件
      run: |
        # ⚠️ 确保这里复制了 repositories.conf
        #cp arm64/{build25.sh,Makefile} imagebuilder/
        cp arm64/build25.sh imagebuilder/
        if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
          cp arm64/openwrt-repositories imagebuilder/repositories
          cat shell/apk-openwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
        else
          cp arm64/immortalwrt-repositories imagebuilder/repositories
          cat shell/apk-immortalwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
        fi 

        chmod +x imagebuilder/apk-custom-packages.sh
        cp shell/prepare-packages.sh imagebuilder/
        mkdir -p imagebuilder/files/etc/uci-defaults imagebuilder/files/etc/apk/repositories.d
        cp files/etc/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
        # 追加自定义源到 APK repositories（FIRMWARE 内 /etc/apk/repositories 会用这个）
        cat files/customfeeds/25.customfeeds.list >> imagebuilder/files/etc/apk/repositories.d/customfeeds.list
        echo "✅ 文件准备完成"

    - name: ⚙️ 动态获取 Kmod 哈希并更新配置
      run: |
        BUILD_VER="${{ env.FINAL_LUCI_VER }}"
        # 确保基础路径正确（ARM 架构路径）
        BASE_URL="https://downloads.${{ env.FINAL_WRT }}.org/releases/${{ env.FINAL_LUCI_VER }}/targets/armsr/armv8/kmods/"
        
        echo "正在从 $BASE_URL 获取最新的内核哈希..."
        KMOD_DIR=$(curl -sL $BASE_URL | grep -oE "[0-9.-]+-[a-f0-9]{32}" | head -n 1)
        if [ -n "$KMOD_DIR" ]; then
          FULL_KMOD_URL="${BASE_URL}${KMOD_DIR}/packages.adb"
          echo "✅ 成功匹配 kmods 路径: $FULL_KMOD_URL"
          # 替换 repositories 文件中的占位符
          sed -i "s|VERSION_PLACEHOLDER|${{ env.FINAL_LUCI_VER }}|g" imagebuilder/repositories
          sed -i "s|KMOD_PLACEHOLDER|${FULL_KMOD_URL}|g" imagebuilder/repositories
        else
          echo "❌ 无法获取 Kmod 哈希"
          exit 1
        fi
        echo "=== repositories 内容 ==="
        cat imagebuilder/repositories

    - name: 🧱 构建 ${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-rootfs 文件
      working-directory: ./imagebuilder
      env:
        ROOTFS_PARTSIZE: ${{ env.ROOTFS_PARTSIZE }}
      run: bash ./build25.sh

    - name: 📝 生成后台描述信息文件
      run: |
        cat << 'EOF' > info.txt
        📡 ------------------------------路由器后台信息------------------------------
        
        📌 版本： ${{ env.FINAL_WRT }}-ARM-${{ env.FINAL_LUCI_VER }}

        🧠 内核： Please Login to → ${{ env.FINAL_WRT }} → System → Amlogic Service → Replace the Kernel
        
        🧩 集成： 包含了基础系统组件、驱动、网络工具、容器支持、LuCI界面及插件等
        
        👤 用户名： root
        
        🔒 密码： 无
        
        🌐 初始IP： ${{ inputs.ipaddr }}
        EOF

    - name: 📝 重命名 rootfs 文件
      run: |
        cd imagebuilder/bin/targets/armsr/armv8
        for f in *generic-rootfs.tar.gz; do
          if [ -f "$f" ]; then
            newname="${f/-rootfs.tar.gz/-rootfs-Docker-${{ env.DOCKER }}.tar.gz}"
            mv "$f" "$newname"
            echo "已重命名: $f → $newname"
          fi
        done
        ls -lh

    - name: 🚀 上传到 Release
      uses: softprops/action-gh-release@v2.2.1
      with:
        tag_name: ${{ env.FINAL_WRT }}-ARM-${{ env.FINAL_LUCI_VER }}-RELEASE-${{ inputs.network_settings }}
        body: |
          📡 ------------------------------路由器后台信息------------------------------
         
          📌 版本： ${{ env.FINAL_WRT }}-ARM-${{ env.FINAL_LUCI_VER }}
          🧠 内核： Please Login to → ${{ env.FINAL_WRT }} → System → Amlogic Service → Replace the Kernel
         
          🧩 集成： 包含了基础系统组件、驱动、网络工具、容器支持、LuCI界面及插件等
         
          👤 用户名： root
         
          🔒 密码： 无
         
          🌐 初始IP： ${{ inputs.ipaddr }}
         
        files: imagebuilder/bin/targets/armsr/armv8/*generic-rootfs-Docker-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
